# ===============================
# APPLICATION
# ===============================

# Identifica la app (No define el nombre de la base de datos ni modifica el nombre del proyecto Maven)
spring.application.name=app-web-finanzas-personales-prueba

# Importar variables de entorno locales
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE - PostgreSQL
# ===============================

# ${NOMBRE_VARIABLE:VALOR_PREDETERMINADO}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate detecta el dialecto automaticamente a partir de la conexion JDBC.
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# DATABASE - MySQL
# ===============================

#spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

# Hibernate detecta automaticamente el dialecto.
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JPA / HIBERNATE
# ===============================

# Spring Boot tiene habilitado por defecto el mecanismo conocido como Open Session in View (OSIV).
# Esto permite mantener abierta la sesión de Hibernate durante todo el procesamiento de una petición HTTP,
spring.jpa.open-in-view=false

# --- para desarrollo ---
# > Crea el esquema al iniciar y lo elimina al cerrar el contexto.
#spring.jpa.hibernate.ddl-auto=create-drop
# > Intenta actualizar el esquema para adaptarlo a las entidades.
spring.jpa.hibernate.ddl-auto=update

# Permite mostrar en la consola las consultas SQL que Hibernate ejecuta.
spring.jpa.show-sql=true
# Hace que las consultas SQL se muestren con un formato m�s legible.
spring.jpa.properties.hibernate.format_sql=true

# --- para produccion ---
# > Comprueba que el esquema sea compatible con las entidades. No lo modifica.
#spring.jpa.hibernate.ddl-auto=validate

# ===============================
# SECURITY
# ===============================

# Propiedades configuran las credenciales del usuario predeterminado que 
# Spring Boot puede crear mediante su autoconfiguracion de seguridad.

# Desactivar login por defecto de Spring.
# spring.security.user.name=disabled
# spring.security.user.password=disabled

# ---------------------------------
# JACKSON - RECHAZA CAMPOS DESCONOCIDOS GLOBALMENTE
# ---------------------------------

spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------
# JWT
# ---------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# LOGGING
# ===============================

# Permite ver los log.debug de la app
logging.level.com.finanzas.app=DEBUG

#logging.level.org.springframework.boot.context.config=TRACE
#logging.level.com.zaxxer.hikari=DEBUG

#logging.level.org.springframework.web=#DEBUG
